<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lycoris • Главная</title>
    <meta name="description" content="Lycoris PWA, APK и статистика">
    
    <!-- PWA manifest (если у тебя уже есть — оставь свой) -->
    <link rel="manifest" href="/Lotos/manifest.json">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6e00ff, #ff00ff, #fefe22, #ffd700, #ffff00, #ff00ff, #6e00ff);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        @keyframes gradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .card:hover {
            transform: translateY(-15px) scale(1.03);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .card h2 {
            color: white;
            margin-bottom: 16px;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        
        .card p {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        
        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn:hover {
            background: white;
            color: #6e00ff;
            transform: scale(1.05);
        }
        
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 3rem;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            letter-spacing: 3px;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.2rem; }
            .card h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <h1 class="title">Lycoris</h1>

    <div class="container">
        
        <!-- Карточка 1 — PWA -->
        <a href="https://inor1loveee.github.io/Lotos/html/" class="card">
            <h2>🌸 Lycoris PWA</h2>
            <p>Веб-приложение с установкой на телефон и ПК<br>Оффлайн-режим • Быстрый запуск</p>
            <div class="btn">Открыть PWA →</div>
        </a>
        
        <!-- Карточка 2 — APK -->
        <a href="https://Inor1Loveee.github.io/Lotos/apk/Lycoris%20v0.0.30.apk" class="card" download>
            <h2>📱 Установить APK</h2>
            <p>Прямая ссылка на установку<br>Версия 0.0.30</p>
            <div class="btn">Скачать APK →</div>
        </a>
        
        <!-- Карточка 3 — Статистика -->
        <a href="https://inor1loveee.github.io/Lotos/FB-RTDB/" class="card">
            <h2>📊 Статистика</h2>
            <p>Данные в реальном времени<br>Firebase RTDB Dashboard</p>
            <div class="btn">Посмотреть статистику →</div>
        </a>
        
    </div>

</body>
</html>
